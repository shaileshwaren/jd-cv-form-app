version: 0.9
name: it_master_ontology
updated: 2025-09-15
maintainer: TalentOps
locale_defaults: ["en", "en-MY", "en-SG", "en-ID", "en-PH", "en-TH", "en-IN", "en-JP"]

description: |
  Unified ontology for **roles + skills** used in JD→CV evaluation. Includes:
  - Canonical roles with aliases (title normalization, regional variants, recruiter tags)
  - Canonical skills with aliases, regex guards, and semantic clustering hints
  - Role↔skill crosswalk (typical core skills per role family)
  - Normalization rules (strip suffixes like (R), numbering, location tags, level tags)
  - Seniority levels and function families
  - Matching priorities: aliases → regex → embeddings (semantic)

matching:
  order: [aliases, regex, embeddings]
  min_similarity: 0.82
  case_insensitive: true
  strip_punctuation: true
  normalize_whitespace: true
  token_filters:
    - drop_tokens: ["(r)", "-r", "(my)", "(sg)", "(id)", "(ph)", "(th)", "(jp)", "malaysia", "singapore", "indonesia", "philippines", "thailand", "japan"]
    - drop_patterns: ["\\b\d{1,3}(-\d+)?\\b", "\\b(v\d+|ver\.?\d+)\\b"]
  seniority_markers:
    intern: ["intern", "trainee", "apprentice"]
    junior: ["junior", "assoc", "entry", "l1"]
    mid: ["mid", "engineer", "consultant"]
    senior: ["senior", "sr", "lead", "principal", "staff", "l2", "l3"]
    manager: ["manager", "mgr", "head", "director", "vp", "chief", "cto", "ciso"]

families:
  - key: engineering
    labels: ["Engineering", "Software Engineering", "Development"]
  - key: data
    labels: ["Data", "Analytics", "AI/ML"]
  - key: infra
    labels: ["Infrastructure", "Cloud", "DevOps", "SRE", "IT Ops"]
  - key: security
    labels: ["Cybersecurity", "GRC", "SecOps"]
  - key: product
    labels: ["Product", "Program", "Project"]
  - key: business
    labels: ["Sales", "BD", "Marketing", "CS"]
  - key: consulting
    labels: ["Consulting", "Advisory", "BA"]
  - key: enterprise_apps
    labels: ["ERP", "CRM", "HCM", "SCM"]
  - key: qa
    labels: ["QA", "Test", "QE"]
  - key: admin_finance_hr
    labels: ["HR", "Admin", "Finance"]

