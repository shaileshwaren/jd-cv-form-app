  - Keep roles and skills keys stable; extend aliases over time.
  - When both parent and child skills match, prefer the most-specific child (e.g., spring_boot over spring).
  - Ambiguous tokens (e.g., "spring") should require co-mentions (e.g., java) or embeddings ≥ min_similarity.
  - Use this ontology with your v2 rubric pipeline: /normalize_terms will first map titles & skills here, then cluster semantically.
